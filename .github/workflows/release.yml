name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    # No Xcode pin needed (unlike Ice): MonkeyNote targets macOS 15.7 with no
    # Liquid-Glass SDK gating, so whatever Xcode ships on the runner works.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag '$TAG' must look like vX.Y.Z (e.g. v1.3.5)"
            exit 1
          fi
          echo "MARKETING_VERSION=$VERSION" >> $GITHUB_ENV
          echo "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER" >> $GITHUB_ENV
          echo "Building version $VERSION ($GITHUB_RUN_NUMBER)"
      - name: Build DMG
        run: ./build.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: release/MonkeyNote.dmg
          generate_release_notes: true
# ponytail: ad-hoc signing is fine for GitHub-DMG distribution ("Open Anyway"
# flow in readme); public notarized releases would need Developer ID + notarize
